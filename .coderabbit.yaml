# CodeRabbit Configuration for AirOps Copilot
version: 2
language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "dev"

  path_filters:
    - "!node_modules/**"
    - "!.next/**"
    - "!out/**"
    - "!package-lock.json"

  instructions: |
    You are reviewing AirOps Copilot, an enterprise-grade TravelTech SaaS application for Travel Management Companies (TMCs).
    Focus on:
    1. Accuracy of TravelTech domain logic: IATA codes, PNR generation (6-char alphanumeric), Net/Gross fare calculations, fare classes (Y/W/J/F).
    2. Resiliency of zero-config fallbacks (Amadeus API fallback to mock dataset; LLM extraction fallback to heuristic regex).
    3. UI polish and accessibility in Tailwind CSS and React/Next.js App Router.
    4. Safe state management and data immutability.

chat:
  auto_reply: true
